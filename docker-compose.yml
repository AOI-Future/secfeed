# Deployment contract: README.md § Deployment; MCP/FastMCP gate: docs/mcp-2026-07-28-migration.md
services:
  secfeed:
    build: .
    container_name: secfeed
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    volumes:
      - secfeed-data:/data
    environment:
      - TZ=Asia/Tokyo
      - SECFEED_DB_PATH=/data/secfeed.db
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
    networks:
      ai_network:

volumes:
  secfeed-data:
    name: secfeed-data

networks:
  ai_network:
    external: true
