# Standalone secfeed compose.
# Public access is through https://mcp.aoifuture.com/secfeed/mcp with Bearer auth.
# No legacy purple aliases or direct SSE endpoint are part of the canonical service.
services:
  secfeed:
    build: .
    container_name: secfeed
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    volumes:
      - secfeed-data:/data
    environment:
      - TZ=Asia/Tokyo
      - SECFEED_DB_PATH=/data/secfeed.db
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
    networks:
      ai_network:

volumes:
  secfeed-data:
    name: secfeed-data

networks:
  ai_network:
    external: true
